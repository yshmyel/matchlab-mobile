name: Agent · Gemini (independent final reviewer, read-only)
# Gemini never gets write access to code or data. It reads the repository, the other
# agents' findings and public sources, then a separate step posts its report. When
# called from the full audit it runs after every other job, so its opinion is last.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or PR number to review
        required: true
  workflow_call:
    inputs:
      issue:
        type: string
        required: true
      mode:
        type: string
        default: audit
    secrets:
      GEMINI_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  gemini:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || inputs.mode == 'audit' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      N: ${{ inputs.issue || github.event.issue.number || github.event.pull_request.number }}
      MODE: ${{ inputs.mode || (github.event.pull_request && 'pr') || (github.event.issue.pull_request && 'pr') || 'issue' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Collect read-only context for Gemini
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agent
          gh issue view "$N" --repo "$GITHUB_REPOSITORY" --comments > .agent/thread.md 2>/dev/null \
            || gh pr view "$N" --repo "$GITHUB_REPOSITORY" --comments > .agent/thread.md
          if [ "$MODE" = pr ]; then gh pr diff "$N" --repo "$GITHUB_REPOSITORY" | head -c 200000 > .agent/pr.diff || true; fi
          python scripts/agent_audit.py --json .agent/audit.json --markdown .agent/audit.md || true
      - name: Fetch earlier agents' reports from the calling audit
        if: inputs.mode == 'audit'
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: .agent/prior
          merge-multiple: true
        continue-on-error: true
      - name: Check Gemini credentials are configured
        id: auth
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: if [ -n "$K" ]; then echo ok=true >> "$GITHUB_OUTPUT"; else echo ok=false >> "$GITHUB_OUTPUT"; fi
      - name: Gemini independent review (no GitHub token, read-only tools)
        id: gemini
        if: steps.auth.outputs.ok == 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # Headless CI needs an explicitly trusted workspace; tools stay limited to the read-only list below.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |
            {"tools": {"core": ["read_file", "read_many_files", "list_directory", "glob", "search_file_content", "google_web_search", "web_fetch"]},
             "telemetry": {"enabled": false}, "privacy": {"usageStatisticsEnabled": false}}
          prompt: |
            You are Gemini, the independent FINAL reviewer for MatchLab, a sports research tracker
            (never a betting bot). Read AGENTS.md first. Mode: ${{ env.MODE }}. Thread: .agent/thread.md.
            Deterministic checks: .agent/audit.md and .agent/audit.json. PR diff (if any): .agent/pr.diff.
            Earlier agents' reports (if any): .agent/prior/*.md.

            Form your OWN judgement; do not defer to Claude, ChatGPT/Codex or the checks.
            - Verify claims against primary sources: fetch ESPN summary URLs
              (https://site.api.espn.com/apis/site/v2/sports/<sport>/<league>/summary?event=<id>) for any
              grade, final score, halftime score or fixture you assess. Quote the source URL for each verdict.
            - Grading: confirm full-game vs halftime markets, PASS never graded as win, cashouts separate,
              missing results stay Pending (never Loss), pushes on exact totals.
            - Code (pr mode): correctness, test coverage, security (no secrets client-side, no betting
              execution), and that historical records in data/ were not rewritten.
            - Say explicitly where you AGREE and DISAGREE with each earlier agent, and what you could not verify.
            Output ONLY a Markdown report with sections: Verdict (one line: APPROVE / CONCERNS / BLOCK),
            Independent verification, Agreement with other agents, Disagreements, Unverified, Recommended actions.
      - name: Post Gemini report (separate step holds the write token)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.auth.outputs.ok }}
          REPORT: ${{ steps.gemini.outputs.summary }}
          ERR: ${{ steps.gemini.outputs.error }}
        run: |
          {
            echo "<!-- agent:gemini kind:final-review -->"
            echo "## 🔷 Gemini — independent final review"
            echo
            if [ "$OK" != true ]; then
              echo "**Gemini agent: not authorized yet.** No \`GEMINI_API_KEY\` secret exists, so Gemini did not run."
              echo "Create a key at https://aistudio.google.com/apikey and add it at https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions/new"
            elif [ -n "$REPORT" ]; then
              printf '%s\n' "$REPORT"
            else
              echo "**Gemini ran but returned no report.** Error: ${ERR:-none reported}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            echo
            echo "<sub>Read-only reviewer · run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID</sub>"
          } > .agent/gemini.md
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file .agent/gemini.md
