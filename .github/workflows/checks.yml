name: MatchLab tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js && node --check research_ui.js && node --check tracker.js && node --check kalshi_ui.js && node --check sw.js
      - run: node tests/test_tracker.cjs && node tests/test_app.cjs && node tests/test_sheets.cjs && node tests/test_kalshi_ui.cjs && node tests/test_kalshi_app.cjs
